# Copy to <repo>/.deepseek/overlay.yml for a TypeScript/JavaScript project.
#
# Needs `typescript-language-server` on PATH. If it is not, set
# ${machine.typescript_language_server} in ~/.deepseek/machine.yml and use that
# instead of the bare command below.
- insert:
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          typescript:
            command: typescript-language-server
            args: ['--stdio']
            extensionToLanguage:
              .ts: typescript
              .tsx: typescriptreact
              .js: javascript
              .mjs: javascript
              .cjs: javascript
    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'
